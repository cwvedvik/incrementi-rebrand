<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Official Incrementi mark (two bars). Plate switches so the mark
       stays visible in a light or dark browser chrome. -->
  <style>
    .plate { fill: #E8E3DE; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #1E1B1C; }
    }
  </style>
  <rect class="plate" width="64" height="64"/>
  <g transform="translate(16 5.3) scale(1)">
    <rect x="0" y="10.71" width="10.57" height="31.98" fill="#765070"/>
    <rect x="21.41" y="0" width="10.57" height="53.40" fill="#507656"/>
  </g>
</svg>
